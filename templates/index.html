<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FuelPulse — Preços de Combustíveis</title>

  <link rel="stylesheet" href="/css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
</head>
<body>

<header>
  <div>
    <h1>⛽ FuelPulse</h1>
    <p>Painel interativo de preços de combustíveis no Brasil e no mundo</p>
  </div>

  <div class="status-area">
    <span id="status" class="badge">Carregando...</span>
    <button id="btn-atualizar">Atualizar</button>
  </div>
</header>

<main>
  <section class="painel">
    <h2>Preços no Brasil</h2>
    <div id="cards-brasil" class="grid"></div>
  </section>

  <section class="painel">
    <h2>Comparação por região</h2>
    <div class="grafico-box">
      <canvas id="grafico-regioes"></canvas>
    </div>
  </section>

  <section class="painel">
    <h2>Ranking global</h2>
    <div id="tabela-mundo"></div>
  </section>
</main>

<div id="modal" class="modal hidden">
  <div class="modal-box">
    <button id="fechar-modal">✕</button>
    <h3 id="modal-titulo"></h3>
    <div id="modal-conteudo"></div>
  </div>
</div>

<footer>
  <p>FuelPulse · Fontes: ANP e OpenVan.camp</p>
</footer>

<script src="/js/dashboard.js"></script>
</body>
</html>
